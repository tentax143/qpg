{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <div class="card">
    <div class="card-header">Security Check</div>
    <div class="card-body">
      <p class="mb-3">You have logged in with a temporary password. Do you want to change your password now?</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" name="action" value="change" class="btn btn-primary me-2">Change password</button>
        <button type="submit" name="action" value="skip" class="btn btn-secondary">Not now</button>
      </form>
    </div>
  </div>
  <div class="mt-3 text-muted">You can always change your password later from your profile.</div>
 </div>
{% endblock %}
